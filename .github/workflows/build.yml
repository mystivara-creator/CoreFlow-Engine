name: Build CoreFlow Module

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'coreflow_engine.cpp'
      - '**.sh'
      - 'Makefile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true

    - name: Verify NDK installation
      run: |
        echo "NDK Path: $ANDROID_NDK_HOME"
        ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++

    - name: Create build directories
      run: |
        mkdir -p build
        mkdir -p dist
        mkdir -p bin

    - name: Compile CoreFlow daemon
      run: |
        export NDK_PATH=$ANDROID_NDK_HOME
        export CXX="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
        export STRIP="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip"
        
        echo "[*] Compiling CoreFlow daemon..."
        $CXX -O3 -march=armv8-a -mtune=cortex-a75 -fPIE -fPIC -Wall -Wextra -std=c++17 \
          -o bin/coreflow_daemon coreflow_engine.cpp -fPIE -pie -lm
        
        if [ ! -f bin/coreflow_daemon ]; then
          echo "ERROR: Compilation failed"
          exit 1
        fi
        
        echo "[✓] Compilation successful"
        ls -lh bin/coreflow_daemon

    - name: Strip binary
      run: |
        export NDK_PATH=$ANDROID_NDK_HOME
        export STRIP="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip"
        
        echo "[*] Stripping binary..."
        $STRIP bin/coreflow_daemon
        
        echo "[✓] Binary stripped"
        ls -lh bin/coreflow_daemon

    - name: Create module structure
      run: |
        MODULE_DIR="build/CoreFlow_Module"
        mkdir -p "$MODULE_DIR/system/xbin"
        mkdir -p "$MODULE_DIR/common"
        
        echo "[*] Creating module structure..."
        
        # Copy module files
        cp module.prop "$MODULE_DIR/"
        cp install.sh "$MODULE_DIR/" && chmod 0755 "$MODULE_DIR/install.sh"
        cp service.sh "$MODULE_DIR/" && chmod 0755 "$MODULE_DIR/service.sh"
        cp post-fs-data.sh "$MODULE_DIR/" && chmod 0755 "$MODULE_DIR/post-fs-data.sh"
        cp uninstall.sh "$MODULE_DIR/" && chmod 0755 "$MODULE_DIR/uninstall.sh"
        
        # Copy binaries
        cp bin/coreflow_daemon "$MODULE_DIR/system/xbin/" && chmod 0755 "$MODULE_DIR/system/xbin/coreflow_daemon"
        cp coreflow-ctl.sh "$MODULE_DIR/system/xbin/" && chmod 0755 "$MODULE_DIR/system/xbin/coreflow-ctl.sh"
        
        # Create system placeholder
        touch "$MODULE_DIR/system/system.prop"
        
        # Copy documentation
        cp README.md "$MODULE_DIR/" 2>/dev/null || true
        cp QUICKSTART.md "$MODULE_DIR/" 2>/dev/null || true
        
        # Create license
        cat > "$MODULE_DIR/LICENSE" << 'EOF'
MIT License

Copyright (c) 2024 CoreFlow Development Team

Permission is hereby granted, free of charge, to any person obtaining a copy
of this software and associated documentation files (the "Software"), to deal
in the Software without restriction, including without limitation the rights
to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
copies of the Software, and to permit persons to whom the Software is
furnished to do so, subject to the following conditions:

The above copyright notice and this permission notice shall be included in all
copies or substantial portions of the Software.

THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.
EOF
        
        echo "[✓] Module structure created"

    - name: Create flashable ZIP
      run: |
        MODULE_DIR="build/CoreFlow_Module"
        OUTPUT_ZIP="dist/CoreFlow_v3.0.zip"
        
        echo "[*] Creating flashable ZIP..."
        cd build
        zip -r -q "../$OUTPUT_ZIP" CoreFlow_Module/ \
          -x "CoreFlow_Module/.*" "CoreFlow_Module/__MACOSX/*"
        cd ..
        
        if [ ! -f "$OUTPUT_ZIP" ]; then
          echo "ERROR: ZIP creation failed"
          exit 1
        fi
        
        echo "[✓] Flashable ZIP created"
        ls -lh "$OUTPUT_ZIP"

    - name: Verify ZIP contents
      run: |
        echo "[*] Verifying ZIP integrity..."
        unzip -t dist/CoreFlow_v3.0.zip
        
        echo "[*] Checking required files..."
        unzip -l dist/CoreFlow_v3.0.zip | grep -E "module.prop|install.sh|coreflow_daemon"
        
        echo "[✓] ZIP verification passed"

    - name: Generate checksums
      run: |
        cd dist
        sha256sum CoreFlow_v3.0.zip > CoreFlow_v3.0.zip.sha256
        md5sum CoreFlow_v3.0.zip > CoreFlow_v3.0.zip.md5
        cat CoreFlow_v3.0.zip.sha256
        cat CoreFlow_v3.0.zip.md5

    - name: Create build info
      run: |
        cat > dist/BUILD_INFO.txt << 'EOF'
========================================
CoreFlow Autonomous Engine v3.0
Build Information
========================================

Build Date:     $(date)
Build Number:   ${{ github.run_number }}
Commit SHA:     ${{ github.sha }}
Commit Message: ${{ github.event.head_commit.message }}
Branch:         ${{ github.ref }}
Status:         ✓ SUCCESS

Binary:         coreflow_daemon (ARM64)
Platform:       Android 5.1+ (API 21+)
Magisk Min:     20.0

Features:
  ✓ Auto-Discovery
  ✓ Adaptive Tuning
  ✓ Real-time Monitoring
  ✓ Graceful Shutdown
  ✓ Comprehensive Logging
  ✓ Configuration Management

Installation:
  1. Flash CoreFlow_v3.0.zip in Magisk Manager
  2. Reboot device
  3. Verify: adb shell pidof coreflow_daemon

========================================
EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: CoreFlow-Build
        path: |
          dist/CoreFlow_v3.0.zip
          dist/CoreFlow_v3.0.zip.sha256
          dist/CoreFlow_v3.0.zip.md5
          dist/BUILD_INFO.txt
        retention-days: 30

    - name: Print build summary
      run: |
        echo "========================================="
        echo "✓ BUILD SUCCESSFUL"
        echo "========================================="
        echo ""
        echo "Artifacts:"
        ls -lh dist/
        echo ""
        echo "Next steps:"
        echo "1. Download CoreFlow_v3.0.zip from artifacts"
        echo "2. Flash in Magisk Manager"
        echo "3. Reboot device"
        echo ""
