name: Build CoreFlow Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan trigger build secara manual

jobs:
  build:
    name: Compile NDK & Package Module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure Android NDK
      run: |
        echo "Menggunakan Android NDK bawaan server GitHub..."
        echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Build C++ Daemon (arm64-v8a)
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-30
        make

    - name: Package KernelSU/Magisk Module
      run: |
        # Pindahkan binary hasil kompilasi ke folder template
        cp build/coreflow_daemon module_template/
        
        # Pindah ke dalam folder template dan bungkus menjadi ZIP
        cd module_template
        zip -r9 ../CoreFlow-Engine-Release.zip .

    - name: Upload Module Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CoreFlow-Engine-Module
        path: CoreFlow-Engine-Release.zip
        
