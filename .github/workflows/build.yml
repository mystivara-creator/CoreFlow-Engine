name: CoreFlow Engine Modern CI

on:
  workflow_dispatch:
    inputs:
      android_min_api:
        description: "Minimum Android API supported by the native build"
        required: false
        default: "34"
        type: string
  push:
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "webui/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - "module/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: coreflow-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "30.0.16248370"
  ANDROID_MIN_API: ${{ inputs.android_min_api || '34' }}
  ANDROID_SDK_API: "36"
  ANDROID_ABI: "arm64-v8a"

jobs:
  host-tests:
    name: Host deterministic tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify host build toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake ninja g++; do
            command -v "$tool" >/dev/null || {
              echo "::error::Required host tool is missing: $tool"
              exit 1
            }
          done
          cmake --version | head -n1
          ninja --version
          g++ --version | head -n1

      - name: Setup Node.js for WebUI build
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build offline React WebUI into module/webroot
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Configure host tests
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build/host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORE_FLOW_BUILD_TESTS=ON

      - name: Build host tests
        run: |
          set -euo pipefail
          cmake --build build/host --parallel $(nproc)

      - name: Run host tests
        run: |
          set -euo pipefail
          ctest --test-dir build/host --output-on-failure --no-tests=error

  android:
    name: Android 15+ ARM64 Production Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: host-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release version alignment
        shell: bash
        run: |
          set -euo pipefail
          MODULE_VERSION="$(awk -F= '$1=="version" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          MODULE_CODE="$(awk -F= '$1=="versionCode" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          CMAKE_VERSION="$(sed -n 's/^project(CoreFlowEngine VERSION \([0-9.]*\) LANGUAGES CXX).*$/\1/p' CMakeLists.txt | head -n1)"
          [[ "$CMAKE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED_CODE="$(awk -F. '{printf "%d", $1 * 10000 + $2 * 1000 + $3 * 100}' <<< "$CMAKE_VERSION")"
          test "$MODULE_VERSION" = "v${CMAKE_VERSION}"
          test "$MODULE_CODE" = "$EXPECTED_CODE"
          echo "Release version aligned: ${CMAKE_VERSION} (${MODULE_VERSION}, code ${MODULE_CODE})"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK & NDK
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_SDK_API}" \
            "ndk;${NDK_VERSION}"

      - name: Configure NDK
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_BIN=${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Setup Node.js for WebUI bundle
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build offline React WebUI into module/webroot
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Verify WebUI payload
        shell: bash
        run: |
          set -euo pipefail
          test -s module/webroot/index.html
          test -s module/webroot/app.js
          test -s module/webroot/style.css

      - name: Configure Android ARM64 Release
        shell: bash
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORE_FLOW_BUILD_TESTS=OFF

      - name: Build and Strip Binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/android-arm64 --parallel $(nproc) --verbose

          BINARY="$(
            find build/android-arm64 \
              -type f \
              -name coreflowd \
              -perm -111 \
              | head -n 1
          )"

          test -n "$BINARY"
          file "$BINARY" | grep -E "ELF 64-bit.*ARM aarch64"
          "${TOOLCHAIN_BIN}/llvm-strip" --strip-all "$BINARY"

      - name: Assemble Module Package
        shell: bash
        run: |
          set -euo pipefail

          BINARY="$(
            find build/android-arm64 \
              -type f \
              -name coreflowd \
              -perm -111 \
              | head -n 1
          )"

          MODULE_DIR="artifacts/CoreFlow-Engine"
          mkdir -p "${MODULE_DIR}/system/bin"
          mkdir -p "${MODULE_DIR}/system/etc/coreflow"

          cp "$BINARY" "${MODULE_DIR}/system/bin/coreflowd"
          cp module/module.prop "${MODULE_DIR}/module.prop"
          cp module/customize.sh "${MODULE_DIR}/customize.sh"
          cp module/service.sh "${MODULE_DIR}/service.sh"
          cp module/system/etc/coreflow/default.conf "${MODULE_DIR}/system/etc/coreflow/default.conf"
          cp -R module/webroot "${MODULE_DIR}/webroot"

          chmod 0755 "${MODULE_DIR}/system/bin/coreflowd"
          chmod 0755 "${MODULE_DIR}/customize.sh"
          chmod 0755 "${MODULE_DIR}/service.sh"
          find "${MODULE_DIR}/webroot" -type f -exec chmod 0644 {} +
          chmod 0644 "${MODULE_DIR}/module.prop"
          chmod 0644 "${MODULE_DIR}/system/etc/coreflow/default.conf"

      - name: Package Module Zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1=="version" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          ZIP="artifacts/CoreFlow-Engine-${VERSION}-arm64.zip"

          cd artifacts/CoreFlow-Engine
          zip -r "../$(basename "$ZIP")" .

      - name: Upload Production Module
        uses: actions/upload-artifact@v7
        with:
          name: CoreFlow-Engine-${{ env.ANDROID_ABI }}-Package
          path: artifacts/CoreFlow-Engine-*-arm64.zip
          if-no-files-found: error
          retention-days: 30
