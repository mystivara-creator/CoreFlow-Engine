
name: CoreFlow Engine CI

on:
  push:
    branches: [main, production-grade-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

  android:
    name: Android ARM64 Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ARM64
        run: |
          export NDK="$ANDROID_NDK_LATEST_HOME"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-android -j2

      - name: Verify and Strip Binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="build-android/daemon"
          test -f "$BINARY"

          file "$BINARY"
          ELF="$("$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$BINARY")"

          grep -q 'Class:.*ELF64' <<< "$ELF"
          grep -q 'Machine:.*AArch64' <<< "$ELF"

          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$BINARY"

      - name: Package Module
        run: |
          set -euo pipefail

          mkdir -p module/system/bin
          install -m 0755 build-android/daemon module/system/bin/coreflow_daemon

          cd module
          zip -qr ../CoreFlow-Engine-Release.zip .

          unzip -l ../CoreFlow-Engine-Release.zip
          unzip -Z1 ../CoreFlow-Engine-Release.zip |
            grep -qx 'system/bin/coreflow_daemon'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-Engine-Module
          path: CoreFlow-Engine-Release.zip
          if-no-files-found: error
