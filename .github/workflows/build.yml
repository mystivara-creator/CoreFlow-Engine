name: CoreFlow Engine Modern CI

on:
  workflow_dispatch:
    inputs:
      android_min_api:
        description: "Minimum Android API supported by the native build (Android 15+ / API 35+)"
        required: false
        default: "35"
        type: string
  push:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "rust/**"
      - "config/**"
      - "android/**"
      - "docs/EQUILIBRIUM_BLUEPRINT.md"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "webui/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "index.html"
      - "module/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: coreflow-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_MIN_API: ${{ inputs.android_min_api || '35' }}
  ANDROID_ABI: "arm64-v8a"

jobs:
  host-tests:
    name: Host deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust 2024 toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add aarch64-linux-android


      - name: Verify host build toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in cmake ninja g++; do
            command -v "$tool" >/dev/null || {
              echo "::error::Required host tool is missing: $tool"
              exit 1
            }
          done
          cmake --version | head -n1
          ninja --version
          g++ --version | head -n1

      - name: Setup Node.js for WebUI build
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build offline React WebUI into module/webroot
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
          node --experimental-strip-types --experimental-transform-types --test webui/engine/__tests__/autonomousEngine.test.ts
          npm run build

      - name: Validate module shell syntax & lifecycle
        shell: bash
        run: |
          set -euo pipefail
          for file in module/*.sh tests/test_module_lifecycle.sh; do sh -n "$file"; done
          sh tests/test_module_lifecycle.sh

      - name: Run Rust controller tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Configure host tests
        run: |
          set -euo pipefail
          cmake \
            -S . \
            -B build/host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORE_FLOW_BUILD_TESTS=ON

      - name: Build host tests
        run: |
          set -euo pipefail
          cmake --build build/host --parallel $(nproc)

      - name: Run host tests
        run: |
          set -euo pipefail
          ctest --test-dir build/host --output-on-failure --no-tests=error

  sanitizer:
    name: ASan + UBSan Memory Sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: host-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust 2024 toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add aarch64-linux-android


      - name: Configure sanitized host build
        run: |
          set -euo pipefail
          cmake -S . -B build/sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORE_FLOW_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized tests
        run: cmake --build build/sanitize --parallel "$(nproc)"

      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure --no-tests=error

  android:
    name: Android 15+ ARM64 Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [host-tests, sanitizer]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust 2024 toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add aarch64-linux-android


      - name: Verify release version alignment
        id: version_info
        shell: bash
        run: |
          set -euo pipefail
          MODULE_VERSION="$(awk -F= '$1=="version" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          MODULE_CODE="$(awk -F= '$1=="versionCode" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          CMAKE_VERSION="$(sed -n 's/^project(CoreFlowEngine VERSION \([0-9.]*\) LANGUAGES CXX).*$/\1/p' CMakeLists.txt | head -n1)"
          [[ "$CMAKE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          EXPECTED_CODE="$(awk -F. '{printf "%d", $1 * 10000 + $2 * 1000 + $3 * 100}' <<< "$CMAKE_VERSION")"
          test "$MODULE_CODE" = "$EXPECTED_CODE"
          test "$MODULE_VERSION" = "v${CMAKE_VERSION}"
          test "$MODULE_VERSION" = "v3.1.0"
          echo "version=${MODULE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${MODULE_CODE}" >> "$GITHUB_OUTPUT"
          echo "Release version aligned: ${CMAKE_VERSION} (${MODULE_VERSION}, code ${MODULE_CODE})"

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "${ANDROID_HOME}/ndk" ] && [ -n "$(ls -A "${ANDROID_HOME}/ndk" 2>/dev/null)" ]; then
            LATEST_NDK="$(ls -d "${ANDROID_HOME}/ndk/"* | sort -V | tail -n 1)"
            echo "Using runner NDK at ${LATEST_NDK}"
            echo "ANDROID_NDK_HOME=${LATEST_NDK}" >> "$GITHUB_ENV"
          else
            echo "Installing Android NDK via sdkmanager..."
            sdkmanager --install "ndk;27.2.12479018"
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js for WebUI bundle
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build offline React WebUI into module/webroot
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
          npm run build

      - name: Verify WebUI payload
        shell: bash
        run: |
          set -euo pipefail
          test -s module/webroot/index.html
          test -s module/webroot/app.js
          test -s module/webroot/style.css
          test -s module/post-fs-data.sh
          test -s module/uninstall.sh

      - name: Configure Android ARM64 Release
        shell: bash
        run: |
          set -euo pipefail
          test "${ANDROID_MIN_API}" -ge 35
          cmake \
            -S . \
            -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORE_FLOW_BUILD_TESTS=OFF

      - name: Build and Strip Binary
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/android-arm64 --parallel $(nproc) --verbose

          BINARY="$(
            find build/android-arm64 \
              -type f \
              -name coreflowd \
              -perm -u+x \
              | head -n 1
          )"

          test -n "$BINARY"
          file "$BINARY" | grep -E "ELF 64-bit.*ARM aarch64"
          
          STRIP_BIN="$(find "$ANDROID_NDK_HOME" -name "llvm-strip" -type f | head -n 1)"
          if [ -n "$STRIP_BIN" ] && [ -x "$STRIP_BIN" ]; then
            "$STRIP_BIN" --strip-all "$BINARY"
          fi

      - name: Assemble Module Package
        shell: bash
        run: |
          set -euo pipefail

          BINARY="$(
            find build/android-arm64 \
              -type f \
              -name coreflowd \
              -perm -u+x \
              | head -n 1
          )"
          VK_LAYER_SO="$(
            find build/android-arm64 \
              -type f \
              -name "libVkLayer_coreflow.so" \
              | head -n 1
          )"

          MODULE_DIR="artifacts/CFAE-System-Framework"
          mkdir -p "${MODULE_DIR}/system/bin"
          mkdir -p "${MODULE_DIR}/system/lib64"
          mkdir -p "${MODULE_DIR}/system/etc/coreflow"
          mkdir -p "${MODULE_DIR}/system/etc/vulkan/implicit_layer.d"

          cp "$BINARY" "${MODULE_DIR}/system/bin/coreflowd"
          if [ -n "$VK_LAYER_SO" ] && [ -f "$VK_LAYER_SO" ]; then
            cp "$VK_LAYER_SO" "${MODULE_DIR}/system/lib64/libVkLayer_coreflow.so"
            chmod 0644 "${MODULE_DIR}/system/lib64/libVkLayer_coreflow.so"
          fi
          cp module/system/etc/vulkan/implicit_layer.d/coreflow_vulkan_layer.json "${MODULE_DIR}/system/etc/vulkan/implicit_layer.d/coreflow_vulkan_layer.json"
          cp module/module.prop "${MODULE_DIR}/module.prop"
          cp module/customize.sh "${MODULE_DIR}/customize.sh"
          cp module/service.sh "${MODULE_DIR}/service.sh"
          cp module/post-fs-data.sh "${MODULE_DIR}/post-fs-data.sh"
          cp module/uninstall.sh "${MODULE_DIR}/uninstall.sh"
          cp module/sepolicy.rule "${MODULE_DIR}/sepolicy.rule"
          cp module/system/etc/coreflow/default.conf "${MODULE_DIR}/system/etc/coreflow/default.conf"
          cp -R module/webroot "${MODULE_DIR}/webroot"

          chmod 0755 "${MODULE_DIR}/system/bin/coreflowd"
          chmod 0755 "${MODULE_DIR}/customize.sh"
          chmod 0755 "${MODULE_DIR}/service.sh"
          chmod 0755 "${MODULE_DIR}/post-fs-data.sh"
          chmod 0755 "${MODULE_DIR}/uninstall.sh"
          chmod 0644 "${MODULE_DIR}/sepolicy.rule"
          chmod 0644 "${MODULE_DIR}/system/etc/vulkan/implicit_layer.d/coreflow_vulkan_layer.json"
          find "${MODULE_DIR}/webroot" -type f -exec chmod 0644 {} +
          chmod 0644 "${MODULE_DIR}/module.prop"
          chmod 0644 "${MODULE_DIR}/system/etc/coreflow/default.conf"

      - name: Package Standalone Flashable Zip
        id: package_zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1=="version" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          ZIP_NAME="CFAE-System-Framework-${VERSION}-arm64.zip"

          cd artifacts/CFAE-System-Framework
          zip -r9 "../../artifacts/${ZIP_NAME}" .
          echo "zip_path=artifacts/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Direct Flashable Module (No Nested Zip)
        uses: actions/upload-artifact@v4
        with:
          name: CFAE-System-Framework-${{ steps.version_info.outputs.version }}-arm64
          path: artifacts/CFAE-System-Framework/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Functional Feature Changelog
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1=="version" {print $2; exit}' module/module.prop | tr -d '[:space:]')"
          TAG="${VERSION}"
          ZIP="${{ steps.package_zip.outputs.zip_path }}"

          # Extract curated functional feature changelog for this version from CHANGELOG.md (excluding commit messages)
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            printf '### CFAE System Framework %s\n\n' "$VERSION" > /tmp/release_notes.md
            printf 'Autonomous mutation-safe system framework with coordinated optimization transactions, semantic UClamp 2.0, multi-sensor thermal matrix, hardware longevity, and idempotent baseline recovery.\n' >> /tmp/release_notes.md
          fi

          echo "Publishing release for ${TAG} with functional changelog..."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}..."
            gh release edit "$TAG" \
              --title "CFAE System Framework ${TAG}" \
              --notes-file /tmp/release_notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "$TAG" "$ZIP" \
              --title "CFAE System Framework ${TAG}" \
              --notes-file /tmp/release_notes.md
          fi
