name: CoreFlow Autonomous Android NDK

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches-ignore:
      - "main"
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "module/**"
      - "tools/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: coreflow-autonomous-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.2.12479018"
  ANDROID_API: "34"
  ANDROID_ABI: "arm64-v8a"

jobs:
  host-tests:
    name: Host deterministic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure host tests
        run: |
          set -euo pipefail
          cmake             -S .             -B build/host             -G Ninja             -DCMAKE_BUILD_TYPE=Debug             -DBUILD_TESTING=ON             -DCORE_FLOW_BUILD_TESTS=ON

      - name: Build host tests
        run: |
          set -euo pipefail
          cmake --build build/host --parallel 2

      - name: Run host tests
        run: |
          set -euo pipefail
          ctest --test-dir build/host --output-on-failure

  android:
    name: Android 14+ ARM64 Production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: host-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install             "platforms;android-${ANDROID_API}"             "ndk;${NDK_VERSION}"

      - name: Configure NDK
        run: |
          set -euo pipefail
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -f "${ANDROID_HOME}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Configure Release
        run: |
          set -euo pipefail
          cmake             -S .             -B build/android-arm64             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"             -DANDROID_ABI="${ANDROID_ABI}"             -DANDROID_PLATFORM="android-${ANDROID_API}"             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_STANDARD=17             -DCMAKE_CXX_STANDARD_REQUIRED=ON             -DCMAKE_CXX_EXTENSIONS=OFF             -DBUILD_TESTING=OFF             -DCORE_FLOW_BUILD_TESTS=OFF

      - name: Build
        run: |
          set -euo pipefail
          cmake --build build/android-arm64 --parallel 2 --verbose

      - name: Verify ELF
        run: |
          set -euo pipefail
          BINARY="$(
            find build/android-arm64               -type f               -name coreflowd               -perm -111               | head -n 1
          )"
          test -n "$BINARY"
          file "$BINARY"
          file "$BINARY" | grep -E "ELF 64-bit.*ARM aarch64"

      - name: Assemble module
        shell: bash
        run: |
          set -euo pipefail

          BINARY="$(
            find build/android-arm64               -type f               -name coreflowd               -perm -111               | head -n 1
          )"
          test -n "$BINARY"

          MODULE_DIR="artifacts/CoreFlow-Autonomous"

          mkdir -p             "${MODULE_DIR}/system/bin"             "${MODULE_DIR}/system/etc/coreflow"

          cp "$BINARY" "${MODULE_DIR}/system/bin/coreflowd"
          cp module/module.prop "${MODULE_DIR}/module.prop"
          cp module/customize.sh "${MODULE_DIR}/customize.sh"
          cp module/post-fs-data.sh "${MODULE_DIR}/post-fs-data.sh"
          cp module/service.sh "${MODULE_DIR}/service.sh"
          cp module/uninstall.sh "${MODULE_DIR}/uninstall.sh"
          cp module/sepolicy.rule "${MODULE_DIR}/sepolicy.rule"
          cp module/system/etc/coreflow/default.conf              "${MODULE_DIR}/system/etc/coreflow/default.conf"

          chmod 0755             "${MODULE_DIR}/system/bin/coreflowd"             "${MODULE_DIR}/customize.sh"             "${MODULE_DIR}/post-fs-data.sh"             "${MODULE_DIR}/service.sh"             "${MODULE_DIR}/uninstall.sh"

          chmod 0644             "${MODULE_DIR}/module.prop"             "${MODULE_DIR}/sepolicy.rule"             "${MODULE_DIR}/system/etc/coreflow/default.conf"

          cat > "${MODULE_DIR}/build.txt" <<EOF
Target: Android 14+
API: ${ANDROID_API}
ABI: ${ANDROID_ABI}
NDK: ${NDK_VERSION}
Build: Release
Commit: ${GITHUB_SHA}
Ref: ${GITHUB_REF}
Run: ${GITHUB_RUN_NUMBER}
EOF

      - name: Package module
        run: |
          set -euo pipefail
          cd artifacts/CoreFlow-Autonomous
          zip -r ../CoreFlow-Autonomous-1.8.0-android14-arm64.zip .

      - name: Verify package
        run: |
          set -euo pipefail
          ZIP="artifacts/CoreFlow-Autonomous-1.8.0-android14-arm64.zip"
          test -f "$ZIP"
          unzip -l "$ZIP"
          unzip -l "$ZIP" | grep -F "system/etc/coreflow/default.conf"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-Autonomous-1.8.0-android14-arm64
          path: artifacts/CoreFlow-Autonomous-1.8.0-android14-arm64.zip
          if-no-files-found: error
          retention-days: 30
