name: CoreFlow Static Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - ".clang-tidy"
      - "tools/cpp_quality_gate.sh"
      - ".github/workflows/cpp-static-audit.yml"

permissions:
  contents: read

concurrency:
  group: coreflow-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Clang-Tidy and Cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cppcheck

      - name: Run static audit
        env:
          COREFLOW_SKIP_BUILD_TESTS: "1"
          COREFLOW_BUILD_JOBS: "2"
        run: bash tools/cpp_quality_gate.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coreflow-static-audit-report
          path: artifacts/cpp-quality/
          if-no-files-found: warn
          retention-days: 14
