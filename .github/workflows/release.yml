name: CoreFlow Release Publisher

on:
  # Publishing is an explicit maintainer action; a successful CI run alone
  # must never create or overwrite a public release.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing validated semantic-version tag to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coreflow-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish explicitly approved version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate tag and locate successful CI run for exact tag commit
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
            echo "::error::Refusing non-semver version tag: $TAG"
            exit 1
          }
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          TAG_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')"
          fi
          [[ "$TAG_TYPE" == "commit" || "$TAG_TYPE" == "tag" ]] || {
            echo "::error::Tag does not resolve to a commit."
            exit 1
          }
          RUN_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CoreFlow Engine CI" --branch "$TAG" --status success --limit 20 --json databaseId,headSha,conclusion,event)"
          RUN_ID="$(jq -r --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success" and .event == "push")] | first | .databaseId // empty' <<< "$RUN_JSON")"
          [[ -n "$RUN_ID" ]] || {
            echo "::error::No successful push-triggered CoreFlow Engine CI run exists for exact tag commit $TAG_SHA."
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Checkout exact validated tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Download package from exact successful CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: CFAE-System-Framework-*-package
          path: release-artifacts
          merge-multiple: true
      - name: Verify package and version identity
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find release-artifacts -type f -name 'CFAE-System-Framework-*-arm64.zip')
          [[ "${#packages[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one flashable ZIP, found ${#packages[@]}."
            find release-artifacts -maxdepth 3 -type f -print
            exit 1
          }
          PACKAGE="${packages[0]}"
          unzip -t "$PACKAGE"
          unzip -p "$PACKAGE" module.prop > "$RUNNER_TEMP/module.prop"
          VERSION="$(awk -F= '$1=="version" {print $2; exit}' "$RUNNER_TEMP/module.prop" | tr -d '[:space:]')"
          [[ "$VERSION" == "$TAG" ]] || {
            echo "::error::Tag ($TAG) does not match packaged module version ($VERSION)."
            exit 1
          }
          echo "Verified release package: $PACKAGE ($VERSION)"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          PACKAGE="$(find release-artifacts -type f -name 'CFAE-System-Framework-*-arm64.zip' -print -quit)"
          awk -v ver="$TAG" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $TAG; refusing to publish incomplete release notes."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite or replace a published release."
            exit 1
          fi
          gh release create "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" \
            --title "CFAE System Framework $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
