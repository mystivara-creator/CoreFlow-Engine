name: CoreFlow Release Publisher

on:
  # Publishing is an explicit maintainer action; a successful CI run alone
  # must never create or overwrite a public release.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing validated semantic-version tag to publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: coreflow-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish explicitly approved version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate tag and locate successful CI run for exact tag commit
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || {
            echo "::error::Refusing non-semver version tag: $TAG"
            exit 1
          }
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          TAG_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
          if [[ "$TAG_TYPE" == "tag" ]]; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_SHA" --jq '.object.sha')"
          fi
          [[ "$TAG_TYPE" == "commit" || "$TAG_TYPE" == "tag" ]] || {
            echo "::error::Tag does not resolve to a commit."
            exit 1
          }
          RUN_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CoreFlow Engine CI" --status success --limit 50 --json databaseId,headSha,conclusion,event)"
          RUN_ID="$(jq -r --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | first | .databaseId // empty' <<< "$RUN_JSON")"
          [[ -n "$RUN_ID" ]] || {
            echo "::error::No successful CoreFlow Engine CI run (push or workflow_dispatch) exists for exact tag commit $TAG_SHA."
            exit 1
          }
          APK_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "CoreFlow Companion APK Build" --status success --limit 50 --json databaseId,headSha,conclusion,event)"
          APK_RUN_ID="$(jq -r --arg sha "$TAG_SHA" '[.[] | select(.headSha == $sha and .conclusion == "success")] | first | .databaseId // empty' <<< "$APK_JSON")"
          if [[ -z "$APK_RUN_ID" ]]; then
            # Fallback when the tag commit did not touch android/**: use latest successful main/dispatch APK run
            APK_RUN_ID="$(jq -r '[.[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | first | .databaseId // empty' <<< "$APK_JSON")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "apk_run_id=$APK_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Checkout exact validated tag commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Download module package from exact successful CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: CFAE-System-Framework*package
          path: release-artifacts
          merge-multiple: true
      - name: Download Companion Release APK from verified APK CI run
        if: steps.source.outputs.apk_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.apk_run_id }}
          pattern: CoreFlow-Companion-APK-Release
          path: release-apk-artifacts
          merge-multiple: true
      - name: Verify package, APK, and version identity
        shell: bash
        env:
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find release-artifacts -type f \( -name 'CFAE-System-Framework-package.zip' -o -name 'CFAE-System-Framework-*-arm64.zip' \))
          [[ "${#packages[@]}" -eq 1 ]] || {
            echo "::error::Expected exactly one flashable ZIP, found ${#packages[@]}."
            find release-artifacts -maxdepth 3 -type f -print
            exit 1
          }
          PACKAGE="${packages[0]}"
          unzip -t "$PACKAGE"
          unzip -p "$PACKAGE" module.prop > "$RUNNER_TEMP/module.prop"
          VERSION="$(awk -F= '$1=="version" {print $2; exit}' "$RUNNER_TEMP/module.prop" | tr -d '[:space:]')"
          [[ "$VERSION" == "$TAG" ]] || {
            echo "::error::Tag ($TAG) does not match packaged module version ($VERSION)."
            exit 1
          }
          echo "Verified release package: $PACKAGE ($VERSION)"
      - name: Publish GitHub Release (Module ZIP + Companion APK + SHA256SUMS)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/release-stage"
          mkdir -p "$STAGE_DIR"
          PACKAGE="$(find release-artifacts -type f \( -name 'CFAE-System-Framework-package.zip' -o -name 'CFAE-System-Framework-*-arm64.zip' \) -print -quit)"
          RELEASE_ZIP="$STAGE_DIR/CFAE-System-Framework-${TAG}-arm64.zip"
          cp "$PACKAGE" "$RELEASE_ZIP"
          ASSETS=("$RELEASE_ZIP")

          if [ -d release-apk-artifacts ]; then
            APK_SRC="$(find release-apk-artifacts -type f -name 'CoreFlow-Companion-*-release.apk' -print -quit || true)"
            if [ -n "$APK_SRC" ] && [ -s "$APK_SRC" ]; then
              RELEASE_APK="$STAGE_DIR/CoreFlow-Companion-${TAG}-release.apk"
              cp "$APK_SRC" "$RELEASE_APK"
              ASSETS+=("$RELEASE_APK")
              echo "Bundled Companion Release APK: $(basename "$RELEASE_APK")"
            fi
          fi

          (cd "$STAGE_DIR" && sha256sum * > SHA256SUMS.txt)
          ASSETS+=("$STAGE_DIR/SHA256SUMS.txt")
          cat "$STAGE_DIR/SHA256SUMS.txt"

          awk -v ver="$TAG" '
            BEGIN { prefix = "## " ver }
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) ~ /[[:space:]—-]/) { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $TAG; refusing to publish incomplete release notes."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite or replace a published release."
            exit 1
          fi
          gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "CFAE System Framework $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
