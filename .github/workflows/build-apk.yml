name: CoreFlow Companion APK Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag (e.g. v5.1.0) to attach the built Release APK to"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: coreflow-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Miuix Compose Companion APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"

      - name: Configure persistent release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Persistent release signing keystore configured."
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required on main/release builds to prevent APK signature conflicts."
            exit 1
          else
            echo "Fork/unprivileged PR without keystore secret; falling back to debug signing."
          fi

      - name: Build Debug and Release APKs
        working-directory: android
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Stage and verify versioned APK outputs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/build.gradle.kts | head -n1)"
          VERSION="${VERSION:-6.0.0}"
          mkdir -p artifacts/apk
          RELEASE_APK="$(find android/build/outputs/apk/release -name '*.apk' | head -n1)"
          DEBUG_APK="$(find android/build/outputs/apk/debug -name '*.apk' | head -n1)"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          cp "$RELEASE_APK" "artifacts/apk/CoreFlow-Companion-v${VERSION}-release.apk"
          cp "$DEBUG_APK" "artifacts/apk/CoreFlow-Companion-v${VERSION}-debug.apk"
          echo "Release APK signing certificate:"
          keytool -printcert -jarfile "artifacts/apk/CoreFlow-Companion-v${VERSION}-release.apk" | grep -E "Owner:|SHA256:" || true
          ls -lh artifacts/apk/

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: CoreFlow-Companion-APK-Release
          path: artifacts/apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CoreFlow-Companion-APK-Debug
          path: artifacts/apk/*-debug.apk
          if-no-files-found: error
          retention-days: 14

  attach-release:
    name: Attach Companion APK to GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build-apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download built Release APK
        uses: actions/download-artifact@v8
        with:
          name: CoreFlow-Companion-APK-Release
          path: release-apk

      - name: Upload APK asset to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid semver release tag: $TAG"
            exit 1
          }
          APK_FILE="$(find release-apk -type f -name 'CoreFlow-Companion-*-release.apk' | head -n1)"
          test -s "$APK_FILE"
          gh release upload "$TAG" "$APK_FILE" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $APK_FILE to GitHub Release $TAG"
