name: CoreFlow Companion APK Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreflow-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Miuix Compose Companion APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Configure optional release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Release signing keystore configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; release APK will use debug signing so it remains directly installable."
          fi

      - name: Build Debug and Release APKs
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Stage versioned APK outputs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/build.gradle.kts | head -n1)"
          VERSION="${VERSION:-5.1.0}"
          mkdir -p artifacts/apk
          RELEASE_APK="$(find android/build/outputs/apk/release -name '*.apk' | head -n1)"
          DEBUG_APK="$(find android/build/outputs/apk/debug -name '*.apk' | head -n1)"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          cp "$RELEASE_APK" "artifacts/apk/CoreFlow-Companion-v${VERSION}-release.apk"
          cp "$DEBUG_APK" "artifacts/apk/CoreFlow-Companion-v${VERSION}-debug.apk"
          ls -lh artifacts/apk/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-Companion-APK-Release
          path: artifacts/apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreFlow-Companion-APK-Debug
          path: artifacts/apk/*-debug.apk
          if-no-files-found: error
          retention-days: 14
