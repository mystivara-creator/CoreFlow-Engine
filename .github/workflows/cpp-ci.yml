name: CoreFlow C++ CI

on:
  push:
    branches: ["**"]
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/cpp-ci.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/cpp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coreflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: |
          cmake -S . -B build/cpp-quality \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCORE_FLOW_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/cpp-quality --parallel 2

      - name: Test
        run: ctest --test-dir build/cpp-quality --output-on-failure --no-tests=error
