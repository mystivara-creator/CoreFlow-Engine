# CoreFlow Engine v5.0.0 — Lean 4-Pillar Adaptive Configuration
# Hardware capabilities are discovered dynamically at startup.

[general]
version = 5.0.0
profile = balanced
inspection_mode = false
log_level = info

[features]
enable_frame_smoothness = true
enable_storage_burst = true
enable_memory_guard = true
enable_thermal_pacing = true

[apps]
gaming_apps =
excluded_apps =

[thermal_guardian]
# Fallback thresholds used only when OEM thermal policy is unavailable.
temp_monitor_interval_ms = 1000
thermal_trip_celsius = 44.0
thermal_recover_celsius = 40.0
emergency_rollback_on_overheat = true

[hardware_longevity]
enable_battery_step_charging = true
battery_step_temp_threshold = 41.5
stepped_charge_current_ma = 1500
top_app_io_weight = 800
background_io_weight = 50
