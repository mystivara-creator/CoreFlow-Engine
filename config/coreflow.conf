# CoreFlow Engine Modern v2
# Persistent runtime copy: /data/adb/coreflow/coreflow.conf

[general]
version = 2.0.0
log_level = info
enable_uclamp = true

[uclamp]
# Internal scheduler capacity scale, converted to the discovered kernel interface.
top_app_interactive_min = 320
top_app_interactive_max = 1024

[thermal]
temp_monitor_interval_ms = 1000
thermal_trip_celsius = 44.0
thermal_recover_celsius = 40.0
emergency_rollback_on_overheat = true

[stability]
# PSI "some" avg10 percentages. These are policy gates, not hardware paths.
cpu_pressure_boost_pct = 8.0
memory_pressure_guard_pct = 3.0
io_pressure_guard_pct = 5.0
thermal_headroom_celsius = 3.0
thermal_emergency_margin_celsius = 4.0
