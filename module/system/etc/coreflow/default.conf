# CoreFlow Autonomous v2.1.0 release defaults: OBSERVE-ONLY.
# No kernel control is written until the operator explicitly opts in by setting
# mutation_mode=adaptive, mutation_armed=true (and allow_cpu_governor=yes for CPU).
# Even when enabled, every mutation still passes capability discovery, effect-model
# ranking, policy authority, journal, bounded write, read-back verification and rollback.
monitor_interval=5
min_confidence=0.70
mutation_mode=observe
allow_cpu_governor=no
runtime_refresh=true
mutation_armed=false
