# CFAE System Framework v3.1.0 Configuration
# Persistent path: /data/adb/coreflow/coreflow.conf
# Packaged default: /system/etc/coreflow/default.conf

[general]
version = 3.1.0
log_level = info
zero_polling_mode = true
enable_cgroups_v2 = true
enable_uclamp = true

[device_adaptation]
# auto, entry, mid_range, upper_mid, flagship
tier_override = auto
unlock_vendor_clamping = false
# Requires explicit platform integration; the daemon never overrides OEM thermal services.
force_120hz_rendering = false
enable_cpu_frequency_control = true
enable_gpu_frequency_control = true

[uclamp_tuning]
# Values between 0 and 1024 (SCHED_CAPACITY_SCALE)
top_app_interactive_min = 320
top_app_interactive_max = 1024
top_app_burst_launch_min = 800
top_app_game_min = 512
top_app_game_max = 980
foreground_min = 60
background_max = 250
sched_util_clamp_min_rt_default = 128
ui_adaptive_bias = balanced
ui_balanced_uclamp_min = 24

# Native thermal policy is automatic (Android severity or sensor-specific OEM trips).
# Fallback Celsius keys below are used only when OEM thermal policy is unavailable.
[thermal_guardian]
temp_monitor_interval_ms = 1000
thermal_trip_celsius = 44.0
thermal_recover_celsius = 40.0
emergency_rollback_on_overheat = true

[stability_policy]
cpu_pressure_boost_pct = 25.0
memory_pressure_guard_pct = 15.0
io_pressure_guard_pct = 15.0
thermal_headroom_celsius = 3.0
thermal_emergency_margin_celsius = 5.0

[pid_equilibrium]
enable_pid_equilibrium = true
# Native PID target is policy-relative (70.0 pressure index); this Celsius key is preview-only.
pid_target_celsius = 42.5
pid_kp = 2.5
pid_ki = 0.15
pid_kd = 1.2

[hardware_longevity]
enable_battery_step_charging = true
enable_ufs_burst_pacing = true
battery_step_temp_threshold = 41.5
stepped_charge_current_ma = 1500
top_app_io_weight = 800
background_io_weight = 50

[render_pipeline]
# Active: verified evdev touch events request a bounded top-app UClamp burst.
# SurfaceFlinger FrameTimeline and display refresh-rate control remain unavailable.
# jank_detection_threshold_ratio is reserved until a trusted frame-timeline source exists.
jank_detection_threshold_ratio = 1.25
burst_boost_duration_ms = 120
touch_boost_uclamp_min = 380

[vulkan_engine]
# Diagnostic/pass-through only. Optimization toggles are reserved and forced inactive.
vulkan_layer_mode = disabled
enable_skiavk_threaded = false
enable_adaptive_vrs = false
enable_pipeline_cache_prewarm = false

