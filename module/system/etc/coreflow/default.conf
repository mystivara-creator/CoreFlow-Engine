# CoreFlow Autonomous v2.2.1 source defaults: OBSERVE-ONLY.
# No kernel control is written until the operator explicitly opts in by setting
# mutation_mode=adaptive, mutation_armed=true (and allow_cpu_governor=yes for CPU).
# Even when enabled, every mutation still passes capability discovery, effect-model
# ranking, policy authority, journal, bounded write, read-back verification and rollback.
# Deep-sleep policy (v2.2.1): when RuntimeState is Idle the daemon sleeps 180–300s
# with a 10s wake slice. No wakelock is held.
monitor_interval=10
min_confidence=0.60
mutation_mode=observe
allow_cpu_governor=no
mutation_armed=false
# User permission per control namespace. Each one is asked for only when the
# device needs that control and the change is evidently safe and useful.
grant_memory=no
grant_block_queue=no
grant_scheduler=no
# Outcome observation uses a fixed 5-sample epoch window in BaselineIntelligence
# (baseline 5 + observation 5). Cooldown after beneficial/neutral keep is 5 samples.
