# CoreFlow System Framework: automatic bounded optimization after boot.
# Installation configures the active engine. Legacy mode/armed keys below are
# compatibility fields, not user-selectable operating modes.
# Capability admission, domain grants, thermal holds, journal, verification,
# measured outcomes and rollback remain enforced. No wakelock is held.
monitor_interval=5
min_confidence=0.60
mutation_mode=adaptive
mutation_armed=true
# Authorization is default-deny in code: a missing key grants nothing, and
# discovery alone never writes. The grants below are explicit so the shipped
# behaviour is traceable. Set a line to =no to deny that domain.
allow_cpu_governor=yes
grant_memory=yes
grant_block_queue=yes
grant_scheduler=yes
grant_gpu=yes
grant_cgroup=yes
grant_cpufreq=yes
grant_kernel=yes
# Fatal surfaces (thermal protection, panic/watchdog, security, hotplug, hard
# limits, storage integrity and trigger nodes) remain excluded.
# Outcome observation uses fixed windows in BaselineIntelligence: a rolling
# 4-sample pre-mutation baseline + 4 observation samples. Cooldown after a
# beneficial/neutral outcome is 4 samples (hold 3 + 1); after regression 4.

# --- Bounded interactivity assistance ------------------------------------
# Enabled automatically. Individual feature settings can be adjusted in WebUI.
# Boosts remain journaled, expiring and subordinate to the common safety holds.
interactivity_mode=adaptive
launch_window_ms=2500
jank_miss_rate=0.05
boost_window_ms=3000
boost_uclamp_launch=20
boost_uclamp_jank=10
boost_readahead_kb=512
boost_gpu_steps=1
