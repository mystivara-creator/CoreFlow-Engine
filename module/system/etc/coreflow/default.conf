# CoreFlow Autonomous v1.9.2 production-safe defaults
# v1.5 is environment/capability discovery only; mutation remains gated.
# Mutation remains disabled until a device-specific policy has been validated.
# Set mutation_mode=adaptive only after per-device validation.
monitor_interval=5
min_confidence=0.70
mutation_mode=disabled
allow_cpu_governor=no
runtime_refresh=true
mutation_armed=false
