# CoreFlow Autonomous v2.4.0 source defaults: OBSERVE-ONLY.
# Kernel mutation requires explicit global opt-in: mutation_mode=adaptive and
# mutation_armed=true. CPUFreq and resource namespaces do not require separate grants.
# Capability discovery, fatal-surface policy, journal, read-back verification,
# rollback and thermal safety remain enforced.
# Deep-sleep policy (v2.2.1): when RuntimeState is Idle the daemon sleeps 180–300s
# with a 10s wake slice. No wakelock is held.
monitor_interval=10
min_confidence=0.60
mutation_mode=observe
mutation_armed=false
# Legacy grant_* and allow_cpu_governor keys are ignored. All discovered
# non-fatal supported namespaces are eligible under the global Adaptive gate.
# Fatal surfaces (thermal protection, panic/watchdog, security, hotplug, hard
# limits, storage integrity and trigger nodes) remain excluded.
# Outcome observation uses fixed windows in BaselineIntelligence: a rolling
# 4-sample pre-mutation baseline + 4 observation samples. Cooldown after a
# beneficial/neutral outcome is 4 samples (hold 3 + 1); after regression 4.

# --- Interactivity pipeline (v2.4.0) -----------------------------------------
# Sensing (frames, GPU busy, foreground/launch, PSI io/memory) always runs and
# is visible in the log as INTERACTIVITY_* lines. Boosts stay OFF until ALL of
# these are set: mutation_mode=adaptive, mutation_armed=true,
# interactivity_mode=adaptive. Boosts are bounded (boost_window_ms),
# self-restoring, journaled, read-back verified, and fully suppressed while the
# thermal guard or a safety hold is active. Observe-only default:
interactivity_mode=observe
launch_window_ms=2500
jank_miss_rate=0.05
boost_window_ms=3000
boost_uclamp_launch=20
boost_uclamp_jank=10
boost_readahead_kb=512
boost_gpu_steps=1
