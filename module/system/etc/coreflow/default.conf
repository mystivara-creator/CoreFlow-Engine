# CFAE System Framework v4.0.0
# All tuning parameters are discovered and calibrated by coreflowd.

[general]
version = 4.0.0
log_level = info
zero_polling_mode = true
enable_cgroups_v2 = true
enable_uclamp = true
enable_tuner = false

[device_adaptation]
tier_override = auto
enable_cpu_frequency_control = true
enable_gpu_frequency_control = true

[direct_adaptive]
enable_direct_adaptive = true
direct_adaptive_policy = auto

[thermal_guardian]
# Used only when OEM thermal policy is unavailable.
temp_monitor_interval_ms = 1000
thermal_trip_celsius = 44.0
thermal_recover_celsius = 40.0
emergency_rollback_on_overheat = true

[vulkan_engine]
vulkan_layer_mode = disabled
enable_skiavk_threaded = false
enable_adaptive_vrs = false
enable_pipeline_cache_prewarm = false
