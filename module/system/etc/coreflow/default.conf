# CFAE System Framework / CoreFlow Engine v6.1.0-R — Unified Zero-Profile Autonomous Configuration
# Hardware capabilities are discovered dynamically at startup via CoreFlow Atlas.

[general]
version = 6.1.0-R
profile = autonomous
inspection_mode = false
log_level = info

[features]
enable_frame_smoothness = true
enable_storage_burst = true
enable_memory_guard = true
enable_thermal_pacing = true
enable_idle_compaction = true
enable_predictive_preload = true
enable_camera_boost = true

[power]
# CFJ4-protected power controls (active only when kernel exposes a safe bypass node)
bypass_charging = false
bypass_on_gaming = false
charge_limit_pct = 0

[apps]
# Per-app Stock OEM bypass list (all other apps are governed autonomously via ContextEngine + App DNA)
excluded_apps =

[thermal_guardian]
# Fallback thresholds used only when OEM thermal policy is unavailable.
temp_monitor_interval_ms = 1000
thermal_trip_celsius = 44.0
thermal_recover_celsius = 40.0
emergency_rollback_on_overheat = true

[hardware_longevity]
enable_battery_step_charging = true
battery_step_temp_threshold = 41.5
stepped_charge_current_ma = 1500
top_app_io_weight = 800
background_io_weight = 50
