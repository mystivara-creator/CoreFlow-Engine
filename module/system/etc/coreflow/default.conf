# CoreFlow Autonomous v2.2.1 source defaults: OBSERVE-ONLY.
# No kernel control is written until the operator explicitly opts in by setting
# mutation_mode=adaptive, mutation_armed=true (and allow_cpu_governor=yes for CPU).
# Even when enabled, every mutation still passes capability discovery, effect-model
# ranking, policy authority, journal, read-back verification and measured rollback.
# Deep-sleep policy (v2.2.1): when RuntimeState is Idle the daemon sleeps 180–300s
# with a 10s wake slice. No wakelock is held.
monitor_interval=10
min_confidence=0.60
mutation_mode=observe
allow_cpu_governor=no
mutation_armed=false
# Per-namespace grants are opt-OUT (capability-driven). Once Adaptive is armed,
# every discovered non-fatal tunable is a candidate; set grant_<ns>=no to exclude
# a namespace. Fatal surfaces (thermal protection, charging, panic/watchdog,
# security, hotplug, hard limits, storage integrity, triggers) are never written.
grant_memory=yes
grant_block_queue=yes
grant_scheduler=yes
grant_gpu=yes
grant_cgroup=yes
grant_cpufreq=yes
grant_kernel=yes
# Outcome observation uses fixed windows in BaselineIntelligence: a rolling
# 4-sample pre-mutation baseline + 4 observation samples. Cooldown after a
# beneficial/neutral outcome is 4 samples (hold 3 + 1); after regression 4.
